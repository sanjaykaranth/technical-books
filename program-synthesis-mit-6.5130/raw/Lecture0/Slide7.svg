al" x="213.33333333333331" y="562.24" text-anchor="start" dominant-baseline="alphabetic" fill-opacity="1">contribution.</text><text fill="#000000" stroke="none" font-family="Bitter" font-size="59.73333333333333px" font-style="normal" font-weight="normal" text-decoration="normal" x="149.33333333333331" y="654.8266666666667" text-anchor="start" dominant-baseline="alphabetic"> Project presentation</text><text fill="rgb(0,100,0)" stroke="none" font-family="Bitter" font-size="49.06666666666666px" font-style="normal" font-weight="normal" text-decoration="normal" x="213.33333333333331" y="746.3466666666667" text-anchor="start" dominant-baseline="alphabetic" fill-opacity="1"> Team will be assigned a single presentation slot, but all team</text><text fill="rgb(0,100,0)" stroke="none" font-family="Bitter" font-size="49.06666666666666px" font-style="normal" font-weight="normal" text-decoration="normal" x="213.33333333333331" y="810.1333333333333" text-anchor="start" dominant-baseline="alphabetic" fill-opacity="1">members must speak during the presentation</text><text fill="#000000" stroke="none" font-family="Bitter" font-size="59.73333333333333px" font-style="normal" font-weight="normal" text-decoration="normal" x="149.33333333333331" y="902.72" text-anchor="start" dominant-baseline="alphabetic"> Project report</text><text fill="rgb(0,100,0)" stroke="none" font-family="Bitter" font-size="49.06666666666666px" font-style="normal" font-weight="normal" text-decoration="normal" x="213.33333333333331" y="994.24" text-anchor="start" dominant-baseline="alphabetic" fill-opacity="1"> For team projects, it needs to be submitted individually by each</text><text fill="rgb(0,100,0)" stroke="none" font-family="Bitter" font-size="49.06666666666666px" font-style="normal" font-weight="normal" text-decoration="normal" x="213.33333333333331" y="1058.0266666666666" text-anchor="start" dominant-baseline="alphabetic" fill-opacity="1">team member, but they can have up to 50% shared content </text></g